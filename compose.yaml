services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
      args:
        UID: ${U_ID}
        GID: ${G_ID}
    user: "${U_ID}:${G_ID}" 
    ports:
      - "${APP_PORT}:5000"
      - ${VITE_PORT}:5173 # vite dev
      - ${VITE_TEST_PORT}:3037 # vite test
    volumes:
      - ./app:/app
    working_dir: /app
    command: ["dotnet", "watch", "run"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    depends_on:
      - db

  nginx:
    image: nginx:stable
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${SQL_SERVER_ROOT_PASSWORD}"
      ACCEPT_EULA: "Y" # 承認する
      MSSQL_PID: Express # エディションの指定
      MSSQL_LCID: 1041 # ロケールのID（日本語） ログ等も含め日本語になるので好みで
      MSSQL_COLLATION: Japanese_CI_AS # 照合順序
    ports:
      - "${SQL_SERVER_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
# 永続化
volumes:
  sqlserver-data:
